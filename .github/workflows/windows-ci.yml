name: windows-ci

# Runs the standalone password-protect tool on a REAL Windows host so the
# scripts and the bundled qpdf.exe is actually executed — the kind of
# verification that cannot happen in a Linux dev container. WPF dialogs need an
# interactive desktop and are not launched here; everything else is exercised.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1 — the exact host PasswordProtect.cmd uses

    steps:
      - uses: actions/checkout@v4

      - name: ASCII source check (PS 5.1 parse safety)
        run: |
          # Non-ASCII bytes in .ps1/.cmd sources have repeatedly broken
          # Windows PowerShell 5.1 parsing in this repo (see git history).
          # Docs are exempt; scripts must be pure ASCII.
          $ErrorActionPreference = 'Stop'
          $offenders = @()
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1','.cmd' } | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 0x7F) {
                $offenders += ('{0}: byte 0x{1:X2} at offset {2}' -f $_.FullName, $bytes[$i], $i)
                break
              }
            }
          }
          if ($offenders.Count) {
            $offenders | ForEach-Object { Write-Host "NON-ASCII: $_" }
            throw "$($offenders.Count) script file(s) contain non-ASCII bytes."
          }
          Write-Host "All script sources are pure ASCII."

      - name: Syntax-check every .ps1 (AST parse)
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' } | ForEach-Object {
            $file = $_.FullName
            $tokens = $null; $perr = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$perr) | Out-Null
            foreach ($e in $perr) {
              $bad += ('{0}:{1}: {2}' -f $file, $e.Extent.StartLineNumber, $e.Message)
            }
          }
          if ($bad.Count) {
            $bad | ForEach-Object { Write-Host "PARSE ERROR: $_" }
            throw "$($bad.Count) parse error(s) found."
          }
          Write-Host "All .ps1 files parsed cleanly."

      - name: Static load check (functions define without running main)
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\Invoke-QPdf.ps1
          foreach ($fn in 'Protect-Pdf') {
            if (-not (Get-Command $fn -ErrorAction SilentlyContinue)) { throw "$fn not defined" }
          }
          # Dot-sourcing sets InvocationName to '.', so the guarded entry point
          # must NOT execute (no dialog, no exit).
          . .\PasswordProtect.ps1
          foreach ($fn in 'Format-DobPassword','Get-OutputPath') {
            if (-not (Get-Command $fn -ErrorAction SilentlyContinue)) {
              throw "$fn not defined after dot-sourcing PasswordProtect.ps1"
            }
          }
          # Spot-check a pure helper end-to-end.
          if ((Format-DobPassword -Day 1 -Month 3 -Year 1970) -ne '01031970') {
            throw "Format-DobPassword produced the wrong value"
          }
          Write-Host "Static load check passed."

      - name: Install Pester 5
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
          }

      - name: Pester tests (all suites, blocking)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Smoke-test bundled binaries (real encryption round-trips)
        run: |
          # 'Continue' (not 'Stop') so that a native tool writing to stderr -- which
          # qpdf does on the INTENTIONAL wrong-password checks below -- is not
          # escalated into a NativeCommandError. Every assertion still fails the
          # step explicitly via `throw` on a bad $LASTEXITCODE / result.
          $ErrorActionPreference = 'Continue'
          . .\src\Invoke-QPdf.ps1
          $qpdf  = (Resolve-Path .\bin\qpdf.exe).Path

          # --- the binaries must launch (proves their runtime DLLs are intact) ---
          & $qpdf --version
          if ($LASTEXITCODE -ne 0) { throw "qpdf --version exited $LASTEXITCODE" }

          # --- shared password (DOB) as a SecureString, exactly like the tool ---
          $pw = '01031970'
          $ss = New-Object System.Security.SecureString
          foreach ($c in $pw.ToCharArray()) { $ss.AppendChar($c) }
          $ss.MakeReadOnly()

          $work = Join-Path $env:RUNNER_TEMP 'pp-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # ============ PDF round-trip (PDF path) ============
          # Hand-rolled minimal PDF with no xref; qpdf rebuilds a clean one.
          # Built as a string array (no here-string) so YAML indentation can
          # never corrupt it.
          $rawPdf = Join-Path $work 'raw.pdf'
          $pdfLines = @(
            '%PDF-1.4'
            '1 0 obj'
            '<< /Type /Catalog /Pages 2 0 R >>'
            'endobj'
            '2 0 obj'
            '<< /Type /Pages /Kids [3 0 R] /Count 1 >>'
            'endobj'
            '3 0 obj'
            '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> /Contents 4 0 R >>'
            'endobj'
            '4 0 obj'
            '<< /Length 40 >>'
            'stream'
            'BT /F1 24 Tf 72 720 Td (Hello CI) Tj ET'
            'endstream'
            'endobj'
            'trailer'
            '<< /Root 1 0 R >>'
            '%%EOF'
          )
          Set-Content -LiteralPath $rawPdf -Value $pdfLines -Encoding ascii

          $cleanPdf = Join-Path $work 'clean.pdf'
          & $qpdf $rawPdf $cleanPdf
          if ($LASTEXITCODE -eq 2)        { throw "qpdf could not normalize the test PDF" }  # 0 ok, 3 warnings(recovered)
          if (-not (Test-Path $cleanPdf)) { throw "qpdf did not produce clean.pdf" }

          $pdfOut = Join-Path $work 'clean_protected.pdf'
          $rp = Protect-Pdf -QpdfPath $qpdf -InputPath $cleanPdf -OutputPath $pdfOut -Password $ss
          if (-not $rp.Success)        { throw "PDF protect failed: $($rp.ErrorCode) $($rp.Stderr)" }
          if (-not (Test-Path $pdfOut)) { throw "protected PDF not created" }

          & $qpdf --is-encrypted $pdfOut
          if ($LASTEXITCODE -ne 0) { throw "output PDF is NOT encrypted (is-encrypted=$LASTEXITCODE)" }

          $dec = Join-Path $work 'dec.pdf'
          & $qpdf --password=$pw --decrypt $pdfOut $dec
          if ($LASTEXITCODE -eq 2)     { throw "qpdf rejected the CORRECT password" }
          if (-not (Test-Path $dec))   { throw "decrypted PDF missing" }

          & $qpdf --password=WRONGPASS --decrypt $pdfOut (Join-Path $work 'bad.pdf') 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "qpdf did NOT reject a wrong password (exit $LASTEXITCODE)" }
          Write-Host "PDF round-trip OK -> $pdfOut"

          Write-Host "All smoke tests passed."
          # The last native call above (the wrong-password check) deliberately
          # leaves $LASTEXITCODE=2; GitHub's powershell wrapper would propagate
          # that as the step result. We got here only because every assertion
          # passed, so exit cleanly.
          exit 0

      - name: E2E launcher mode (guided setup.ps1, no admin)
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $psExe = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'

          # Self-contained copy of the tool, plus sandbox locations. %ProgramData%
          # is redirected under RUNNER_TEMP so the escrow cert / audit / cache land
          # in the sandbox, not on the machine.
          $app = Join-Path $env:RUNNER_TEMP 'launcher-app'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          foreach ($sub in 'src','bin','config','admin') { Copy-Item (Join-Path $src $sub) $app -Recurse -Force }
          foreach ($f in 'setup.ps1','install.ps1','VERSION') { Copy-Item (Join-Path $src $f) $app -Force }

          $pd        = Join-Path $env:RUNNER_TEMP 'launcher-pd'
          $clientOut = Join-Path $env:RUNNER_TEMP 'shared\clients.csv'
          $escrowDir = Join-Path $env:RUNNER_TEMP 'escrow-store'
          $pfx       = Join-Path $env:RUNNER_TEMP 'escrow.pfx'
          $fixture   = Join-Path $src 'tests\fixtures\clients-sample.csv'

          # Run setup in a CHILD process (its `exit` must not end this step) and
          # capture ALL output so a setup.ps1 failure is fully visible.
          $inner = "& '$app\setup.ps1' -Mode Launcher -NonInteractive " +
                   "-ClientListPath '$clientOut' -EscrowDir '$escrowDir' -ClientSource '$fixture' " +
                   "-PfxPath '$pfx' -PfxPassword (ConvertTo-SecureString 'ci-pfx-pw-1' -AsPlainText -Force)"
          $la  = Join-Path $env:RUNNER_TEMP 'launcher-localappdata'
          New-Item -ItemType Directory -Force -Path $la | Out-Null
          $userSettings = Join-Path $la 'CuroPDFProtect\settings.json'
          $cmd = "`$env:ProgramData='$pd'; `$env:LOCALAPPDATA='$la'; $inner; exit `$LASTEXITCODE"
          $ErrorActionPreference = 'Continue'
          $childOut = & $psExe -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host "----- setup.ps1 (launcher) output -----"
          Write-Host $childOut
          Write-Host "----- exit=$rc -----"
          if ($rc -ne 0) { throw "setup.ps1 -Mode Launcher exited $rc" }

          if (-not (Test-Path $userSettings))                                  { throw "no per-user settings.json at $userSettings" }
          if (-not (Test-Path (Join-Path $pd  'CuroPDFProtect\escrow.cer')))   { throw "no escrow public cert" }
          if (-not (Test-Path $pfx))                                           { throw "no escrow private pfx" }
          if (@(Import-Csv -LiteralPath $clientOut).Count -ne 2)               { throw "expected 2 published clients (1 malformed row skipped)" }

          # The setup-produced config must be healthy, and the core protect chain
          # must work against it (setup -> protect -> qpdf-decrypt with the DOB).
          Import-Module (Join-Path $app 'src\Config.psm1')  -Force -DisableNameChecking
          Import-Module (Join-Path $app 'src\Protect.psm1') -Force -DisableNameChecking
          $env:ProgramData = $pd
          $env:LOCALAPPDATA = $la
          $cfg = Get-CuroConfig -Path $userSettings
          $health = Test-CuroHealth -Path $userSettings
          if (-not $health.Healthy) { throw "post-setup health not green: $(($health.Issues | ForEach-Object { $_.Component }) -join ', ')" }

          # qpdf writes warnings to stderr for the hand-rolled PDF; under
          # EAP=Stop that stderr escalates into a NativeCommandError. Switch to
          # Continue - every check below asserts explicitly via throw.
          $ErrorActionPreference = 'Continue'

          # Build a tiny PDF and protect it through the real chain.
          $work = Join-Path $env:RUNNER_TEMP 'launcher-protect'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $qpdf = $cfg.qpdf_path
          $raw = Join-Path $work 'raw.pdf'
          @('%PDF-1.4','1 0 obj','<< /Type /Catalog /Pages 2 0 R >>','endobj','2 0 obj','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','endobj','3 0 obj','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>','endobj','trailer','<< /Root 1 0 R >>','%%EOF') | Set-Content -LiteralPath $raw -Encoding ascii
          $doc = Join-Path $work 'doc.pdf'
          & $qpdf $raw $doc 2>&1 | Out-Null
          $ss = New-Object System.Security.SecureString
          # An arbitrary 8-digit test password, NOT read from the client fixture
          # (this step protects and decrypts with the same literal, so it proves
          # the crypto round-trip, not the clients.csv -> DOB link). The
          # CSV -> client -> password chain is proven in the simulated user
          # journey step, which reads every DOB back from the published list.
          foreach ($c in '01031990'.ToCharArray()) { $ss.AppendChar($c) }
          $ss.MakeReadOnly()
          $prompt = [pscustomobject]@{ SecurePassword=$ss; PasswordSource='dob'; ClientFileRef='C-00502'; DeleteOriginal=$false; AllowOverwrite=$false; OpenOutlook=$false; Cancelled=$false }
          $res = Invoke-ProtectFileCore -Config $cfg -Path $doc -PromptResult $prompt
          if (-not $res.Success) { throw "protect through setup config failed: $($res.Message)" }
          $out = Join-Path $work 'doc_protected.pdf'
          if (-not (Test-Path $out)) { throw "protected PDF not produced" }
          & $qpdf --password=01031990 --decrypt $out (Join-Path $work 'dec.pdf') 2>&1 | Out-Null
          if (($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3)) { throw "decrypt with the DOB failed ($LASTEXITCODE)" }
          $sidecar = Get-ChildItem -Path $escrowDir -Filter '*.escrow.json' -Recurse | Select-Object -First 1
          if (-not $sidecar) { throw "no escrow sidecar written" }
          $entry = Get-Content -LiteralPath $sidecar.FullName -Raw | ConvertFrom-Json
          if ($entry.key_wrap_algorithm -ne 'rsa-oaep-sha256-cert') { throw "escrow not SHA-256 wrapped: $($entry.key_wrap_algorithm)" }

          # Full recovery loop: reopen the setup-generated PFX (with its password)
          # and recover the escrowed password - it must equal the DOB.
          . (Join-Path $app 'admin\Recover-File.ps1')   # Unprotect-EscrowEntry (guarded main)
          $recCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, (ConvertTo-SecureString 'ci-pfx-pw-1' -AsPlainText -Force), [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          try { $recovered = Unprotect-EscrowEntry -Entry $entry -Certificate $recCert -Which user } finally { $recCert.Dispose() }
          if ($recovered -ne '01031990') { throw "recovered password mismatch: got '$recovered', expected the DOB" }

          Write-Host "Launcher E2E OK: setup -> healthy -> protect -> decrypt -> SHA-256 escrow -> recover with the PFX."
          exit 0

      - name: Two machines share ONE escrow key (split-key regression)
        run: |
          # A second PC that mints its own escrow key writes sidecars the team's
          # recovery PFX cannot open, and nothing surfaces it until a real
          # recovery fails. Simulate machine 2 by pointing ProgramData somewhere
          # new while keeping the SAME shared escrow dir, and prove that (a) it
          # adopts rather than generates, and (b) a file it protects recovers
          # with MACHINE 1's PFX.
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $psExe = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $env:CURO_SUPPRESS_UI = '1'

          $app = Join-Path $env:RUNNER_TEMP 'splitkey-app'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          foreach ($sub in 'src','bin','config','admin') { Copy-Item (Join-Path $src $sub) $app -Recurse -Force }
          foreach ($f in 'setup.ps1','install.ps1','VERSION') { Copy-Item (Join-Path $src $f) $app -Force }

          $shared    = Join-Path $env:RUNNER_TEMP 'splitkey-shared'
          $escrowDir = Join-Path $shared 'escrow'
          $clientOut = Join-Path $shared 'clients.csv'
          $fixture   = Join-Path $src 'tests\fixtures\clients-sample.csv'
          $pd1 = Join-Path $env:RUNNER_TEMP 'splitkey-pd1'
          $pd2 = Join-Path $env:RUNNER_TEMP 'splitkey-pd2'
          $pfx = Join-Path $env:RUNNER_TEMP 'splitkey-escrow.pfx'

          function Invoke-Setup([string]$ProgramData, [string]$Extra) {
            $la = "$ProgramData-local"
            $inner = "`$env:ProgramData='$ProgramData'; `$env:LOCALAPPDATA='$la'; & '$app\setup.ps1' -Mode Launcher -NonInteractive " +
                     "-ClientListPath '$clientOut' -EscrowDir '$escrowDir' -ClientSource '$fixture' -Force $Extra; exit `$LASTEXITCODE"
            $ErrorActionPreference = 'Continue'
            $out = & $psExe -NoProfile -ExecutionPolicy Bypass -Command $inner 2>&1 | Out-String
            $script:lastRc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            return $out
          }

          # Machine 1 generates and publishes the deployment key.
          $o1 = Invoke-Setup $pd1 "-PfxPath '$pfx' -PfxPassword (ConvertTo-SecureString 'split-pw-1' -AsPlainText -Force)"
          if ($lastRc -ne 0) { throw "machine 1 setup failed:`n$o1" }
          $deployCert = Join-Path $escrowDir '_deployment\escrow.cer'
          if (-not (Test-Path $deployCert)) { throw "machine 1 did not publish the deployment cert" }

          # Machine 2: fresh ProgramData, no PFX args. Must ADOPT, not generate.
          Remove-Item -Recurse -Force $pd2 -ErrorAction SilentlyContinue
          $o2 = Invoke-Setup $pd2 ''
          if ($lastRc -ne 0) { throw "machine 2 setup failed:`n$o2" }
          if ($o2 -notmatch 'Adopted the existing deployment escrow certificate') { throw "machine 2 did not adopt the deployment key:`n$o2" }

          Import-Module (Join-Path $app 'src\Config.psm1') -Force -DisableNameChecking
          $fp1 = Get-CuroCertFingerprint -Path (Join-Path $pd1 'CuroPDFProtect\escrow.cer')
          $fp2 = Get-CuroCertFingerprint -Path (Join-Path $pd2 'CuroPDFProtect\escrow.cer')
          if ($fp1 -ne $fp2) { throw "SPLIT KEY: machine1=$fp1 machine2=$fp2" }
          Write-Host "Both machines wrap under the same escrow key: $fp1"

          # Machine 2 protects a file; machine 1's PFX must recover it.
          $ErrorActionPreference = 'Continue'
          $env:ProgramData = $pd2
          Import-Module (Join-Path $app 'src\Protect.psm1') -Force -DisableNameChecking
          $env:LOCALAPPDATA = "$pd2-local"
          $cfg2 = Get-CuroConfig -Path (Join-Path "$pd2-local" 'CuroPDFProtect\settings.json')
          $work = Join-Path $env:RUNNER_TEMP 'splitkey-work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $raw = Join-Path $work 'raw.pdf'
          @('%PDF-1.4','1 0 obj','<< /Type /Catalog /Pages 2 0 R >>','endobj','2 0 obj','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','endobj','3 0 obj','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>','endobj','trailer','<< /Root 1 0 R >>','%%EOF') | Set-Content -LiteralPath $raw -Encoding ascii
          $doc = Join-Path $work 'm2.pdf'
          & $cfg2.qpdf_path $raw $doc 2>&1 | Out-Null
          $ss = New-Object System.Security.SecureString
          foreach ($c in '01031990'.ToCharArray()) { $ss.AppendChar($c) }
          $ss.MakeReadOnly()
          $prompt = [pscustomobject]@{ SecurePassword=$ss; PasswordSource='dob'; ClientFileRef='C-00502'; DeleteOriginal=$false; AllowOverwrite=$false; OpenOutlook=$false; Cancelled=$false }
          $res = Invoke-ProtectFileCore -Config $cfg2 -Path $doc -PromptResult $prompt
          if (-not $res.Success) { throw "machine 2 protect failed: $($res.Message)" }
          $ErrorActionPreference = 'Stop'

          $sidecar = Get-ChildItem -Path $escrowDir -Filter '*.escrow.json' -Recurse | Sort-Object LastWriteTime | Select-Object -Last 1
          $entry = Get-Content -LiteralPath $sidecar.FullName -Raw | ConvertFrom-Json
          . (Join-Path $app 'admin\Recover-File.ps1')
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, (ConvertTo-SecureString 'split-pw-1' -AsPlainText -Force), [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          try { $rec = Unprotect-EscrowEntry -Entry $entry -Certificate $cert -Which user } finally { $cert.Dispose() }
          if ($rec -ne '01031990') { throw "machine 1's PFX could not recover machine 2's file (got '$rec')" }
          Write-Host "Machine 1's recovery PFX opened machine 2's protected file."

          # And a genuinely divergent key must be reported unhealthy, not ignored.
          $rogue = Join-Path $env:RUNNER_TEMP 'splitkey-rogue.pfx'
          Remove-Item -LiteralPath $rogue -ErrorAction SilentlyContinue
          $mk = "`$env:ProgramData='$pd2'; `$env:CURO_SETTINGS_PATH='$pd2-local\CuroPDFProtect\settings.json'; " +
                "& '$app\admin\Rotate-EscrowKey.ps1' -NewPrivateKeyPath '$rogue' -PfxPassword (ConvertTo-SecureString 'rogue' -AsPlainText -Force) | Out-Null; exit 0"
          $ErrorActionPreference = 'Continue'
          & $psExe -NoProfile -ExecutionPolicy Bypass -Command $mk 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          # Rotation republishes, so restore the ORIGINAL deployment cert to make
          # machine 2 genuinely divergent from the published key.
          Copy-Item -LiteralPath (Join-Path $pd1 'CuroPDFProtect\escrow.cer') -Destination $deployCert -Force
          $env:ProgramData = $pd2
          $h = Test-CuroHealth -Path (Join-Path "$pd2-local" 'CuroPDFProtect\settings.json')
          if ($h.Healthy) { throw "a divergent escrow key was NOT reported unhealthy" }
          if (-not ($h.Issues | Where-Object { $_.Component -eq 'escrow key' })) { throw "divergence not attributed to 'escrow key': $(($h.Issues | ForEach-Object { $_.Component }) -join ', ')" }
          Write-Host "Divergent escrow key correctly reported unhealthy."
          exit 0

      - name: Concurrent protects + audit archive round-trip
        run: |
          # Two staff protecting files in the SAME shared folder at the same
          # moment used to collide: qpdf staged every job at a fixed
          # "<output>.tmp" beside the source, so one run renamed the other's
          # half-written file. And the audit log is per-machine with nothing
          # aggregating it, which is not a 7-year record.
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $env:CURO_SUPPRESS_UI = '1'
          Import-Module (Join-Path $src 'src\Config.psm1')  -Force -DisableNameChecking
          Import-Module (Join-Path $src 'src\Protect.psm1') -Force -DisableNameChecking
          . (Join-Path $src 'src\Invoke-QPdf.ps1')

          $work = Join-Path $env:RUNNER_TEMP 'concurrent'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $qpdf = (Resolve-Path (Join-Path $src 'bin\qpdf.exe')).Path
          $raw = Join-Path $work 'raw.pdf'
          @('%PDF-1.4','1 0 obj','<< /Type /Catalog /Pages 2 0 R >>','endobj','2 0 obj','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','endobj','3 0 obj','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>','endobj','trailer','<< /Root 1 0 R >>','%%EOF') | Set-Content -LiteralPath $raw -Encoding ascii

          $ErrorActionPreference = 'Continue'
          # Same input, several simultaneous encrypts to distinct outputs in one
          # folder - the shared-client-folder shape.
          $jobs = 1..4 | ForEach-Object {
            $i = $_
            $doc = Join-Path $work "doc$i.pdf"
            & $qpdf $raw $doc 2>&1 | Out-Null
            Start-Job -ScriptBlock {
              param($srcDir, $qpdfPath, $inPath, $outPath)
              . (Join-Path $srcDir 'src\Invoke-QPdf.ps1')
              $ss = New-Object System.Security.SecureString
              foreach ($c in '01031990'.ToCharArray()) { $ss.AppendChar($c) }
              $ss.MakeReadOnly()
              $r = Protect-Pdf -QpdfPath $qpdfPath -InputPath $inPath -OutputPath $outPath -Password $ss
              [pscustomobject]@{ Success = $r.Success; Err = $r.ErrorCode; Out = $outPath }
            } -ArgumentList $src, $qpdf, $doc, (Join-Path $work "doc${i}_protected.pdf")
          }
          $results = $jobs | Wait-Job -Timeout 180 | Receive-Job
          $jobs | Remove-Job -Force -ErrorAction SilentlyContinue
          # Stay on 'Continue' through the qpdf calls below. The hand-rolled
          # minimal PDF makes qpdf emit "file is damaged" on stderr (it
          # reconstructs and exits 3, success-with-warnings), and under 'Stop'
          # that stderr becomes a terminating NativeCommandError. Every check
          # here asserts explicitly via throw, so nothing is masked.

          $failed = @($results | Where-Object { -not $_.Success })
          if ($failed.Count) { throw "concurrent protect failures: $(($failed | ForEach-Object { $_.Err }) -join ', ')" }
          foreach ($r in $results) { if (-not (Test-Path $r.Out)) { throw "missing output $($r.Out)" } }
          $leftovers = @(Get-ChildItem -Path $work -Filter '*.tmp' -ErrorAction SilentlyContinue)
          if ($leftovers.Count) { throw "temp files left behind: $($leftovers.Name -join ', ')" }
          foreach ($r in $results) {
            & $qpdf --password=01031990 --decrypt $r.Out (Join-Path $work ("dec-" + (Split-Path $r.Out -Leaf))) 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { throw "concurrent output $($r.Out) does not decrypt" }
          }
          Write-Host "4 concurrent protects into one folder: all distinct, all decrypt, no temp left behind."

          # Back to Stop for the archive checks: no native commands run below,
          # so a throw inside the scripts should abort the step. (Do NOT test
          # $LASTEXITCODE after invoking a .ps1 - a script only sets it if it
          # calls exit, so it would still hold qpdf's exit 3 from above.)
          $ErrorActionPreference = 'Stop'

          # Audit archive: per-machine log -> dated per-host folder, and the
          # summary must read the ARCHIVE (every host) not just this PC.
          $archive = Join-Path $env:RUNNER_TEMP 'audit-archive'
          $localLog = Join-Path $env:RUNNER_TEMP 'concurrent-audit.log'
          @(
            '{"ts":"2026-01-02T03:04:05.0000000Z","v":"1.0.0","host":"PC-A","user":"CURO\\alice","op":"protect","outcome":"ok"}'
            '{"ts":"2026-01-02T03:04:06.0000000Z","v":"1.0.0","host":"PC-A","user":"CURO\\alice","op":"protect","outcome":"fail","error_code":"ESCROW_OFFLINE"}'
          ) | Set-Content -LiteralPath $localLog -Encoding ascii

          & (Join-Path $src 'admin\Export-AuditArchive.ps1') -ArchiveRoot $archive -AuditPath $localLog | Out-Null
          $snap = @(Get-ChildItem -Path $archive -Filter 'audit-*.log' -Recurse)
          if ($snap.Count -ne 1) { throw "expected 1 archived snapshot, found $($snap.Count)" }

          # Running twice must not double-count: each run copies the WHOLE log,
          # so the same events appear in both snapshots.
          & (Join-Path $src 'admin\Export-AuditArchive.ps1') -ArchiveRoot $archive -AuditPath $localLog | Out-Null
          $snap2 = @(Get-ChildItem -Path $archive -Filter 'audit-*.log' -Recurse)
          if ($snap2.Count -ne 2) { throw "expected 2 distinct snapshots after a second run, found $($snap2.Count)" }

          # Capture ALL streams: the script reports via Write-Host, which goes to
          # the information stream and is NOT picked up by 2>&1 alone.
          $summary = & (Join-Path $src 'admin\Get-AuditSummary.ps1') -ArchiveRoot $archive -Days 36500 *>&1 | Out-String
          if ($summary -notmatch '2 snapshot') { throw "summary did not read both snapshots:`n$summary" }
          if ($summary -notmatch 'Events:\s+2') { throw "archive summary did not de-duplicate repeated snapshots (expected 2 events):`n$summary" }
          Write-Host "Audit archive round-trip OK (2 snapshots, 2 unique events)."
          exit 0

      - name: E2E install mode (machine-wide install + uninstall)
        run: |
          # The runner is admin, so exercise the real install path: payload
          # copy + hash verify + HKLM context menus (with -STA) + ProgramData
          # settings, then uninstall and confirm the audit log is preserved.
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'CuroInstall'

          & .\install.ps1 -SourcePath $src -InstallDir $installDir -NoExplorerRestart -Silent
          foreach ($rel in 'src\Protect-File.ps1','bin\qpdf.exe','admin\Recover-File.ps1') {
            if (-not (Test-Path (Join-Path $installDir $rel))) { throw "install did not place $rel" }
          }
          $pd = 'C:\ProgramData\CuroPDFProtect'
          if (-not (Test-Path (Join-Path $pd 'settings.json'))) { throw "install did not write ProgramData settings.json" }

          # Every registered context-menu command must carry -STA. Read via the
          # .NET registry API - the ProgID key is literally "*", which the
          # PowerShell provider would treat as a wildcard.
          function Get-CommandValue($sub) {
            $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($sub)
            if (-not $k) { return $null }
            try { return $k.GetValue('') } finally { $k.Close() }
          }
          $subs = @(
            'Software\Classes\*\shell\CuroProtectWithPassword\command',
            'Software\Classes\*\shell\CuroProtectAndEmail\command',
            'Software\Classes\Directory\shell\CuroProtectFolder\command'
          )
          foreach ($sub in $subs) {
            $cmd = Get-CommandValue $sub
            if (-not $cmd) { throw "missing context-menu key: $sub" }
            if ($cmd -notmatch '\-STA') { throw "context-menu command lacks -STA: $cmd" }
          }
          Write-Host "Install OK: payload + ProgramData settings + 3 HKLM keys with -STA."

          # ACL: settings.json must be read-only for Users; audit.log writable.
          # (Runners run elevated, so prove intent by ACE inspection.)
          function User-Rights($path) {
            (Get-Acl -LiteralPath $path).Access |
              Where-Object { $_.IdentityReference -match 'Users$' -and $_.AccessControlType -eq 'Allow' } |
              ForEach-Object { $_.FileSystemRights.ToString() }
          }
          $sRights = (User-Rights (Join-Path $pd 'settings.json')) -join ';'
          if ($sRights -match 'Modify|FullControl|\bWrite') { throw "Users have write on settings.json: $sRights" }
          $aRights = (User-Rights (Join-Path $pd 'audit.log')) -join ';'
          if ($aRights -notmatch 'Modify|FullControl|\bWrite') { throw "Users cannot write the audit log: $aRights" }
          Write-Host "ACL OK: settings.json read-only for Users ($sRights); audit.log writable ($aRights)."

          # Drop a fake audit row, then uninstall WITHOUT -PurgeAuditLog and
          # confirm it survives (7-year retention) while keys + dir are gone.
          Set-Content -LiteralPath (Join-Path $pd 'audit.log') -Value '{"op":"test"}' -Encoding utf8
          & .\uninstall.ps1 -InstallDir $installDir -NoExplorerRestart
          if (Test-Path $installDir)                { throw "uninstall left the install dir behind" }
          if (Get-CommandValue $subs[0])            { throw "uninstall left a context-menu key behind" }
          if (-not (Test-Path (Join-Path $pd 'audit.log'))) { throw "uninstall wrongly deleted the audit log" }
          Write-Host "Uninstall OK: keys + dir removed, audit log preserved."

      - name: Tampered / unpinned binary is refused at install
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          function New-Source([string]$dest) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            foreach ($sub in 'src','bin','config','admin') { Copy-Item (Join-Path $src $sub) $dest -Recurse -Force }
            foreach ($f in 'install.ps1','uninstall.ps1','VERSION') { Copy-Item (Join-Path $src $f) $dest -Force }
          }
          # (a) A flipped byte in a pinned DLL must be refused, naming the file.
          $badA = Join-Path $env:RUNNER_TEMP 'src-tampered'
          New-Source $badA
          $dll = Join-Path $badA 'bin\qpdf29.dll'
          $b = [IO.File]::ReadAllBytes($dll); $b[200] = $b[200] -bxor 0xFF; [IO.File]::WriteAllBytes($dll, $b)
          $threw = $false; $msg = ''
          try { & "$badA\install.ps1" -SourcePath $badA -InstallDir (Join-Path $env:RUNNER_TEMP 'InstBadA') -NoExplorerRestart -Silent }
          catch { $threw = $true; $msg = $_.Exception.Message }
          if (-not $threw)            { throw "install did NOT refuse a tampered qpdf29.dll" }
          if ($msg -notmatch 'qpdf29\.dll') { throw "refusal did not name qpdf29.dll: $msg" }
          Write-Host "Refused tampered DLL: $msg"

          # (b) An unpinned extra binary must be refused.
          $badB = Join-Path $env:RUNNER_TEMP 'src-unpinned'
          New-Source $badB
          Set-Content -LiteralPath (Join-Path $badB 'bin\evil.dll') -Value 'x' -Encoding ascii
          $threw = $false; $msg = ''
          try { & "$badB\install.ps1" -SourcePath $badB -InstallDir (Join-Path $env:RUNNER_TEMP 'InstBadB') -NoExplorerRestart -Silent }
          catch { $threw = $true; $msg = $_.Exception.Message }
          if (-not $threw)          { throw "install did NOT refuse an unpinned binary" }
          if ($msg -notmatch 'evil\.dll') { throw "refusal did not name evil.dll: $msg" }
          Write-Host "Refused unpinned binary: $msg"

      - name: Portable launcher exe (build, payload fidelity, E2E, fail-closed)
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $proj = Join-Path $src 'launcher\CuroPdfProtect.Launcher\CuroPdfProtect.Launcher.csproj'
          $pub  = Join-Path $env:RUNNER_TEMP 'launcher-publish'

          # 1. Build. net48 + embedded resources IS one file - no -r, no
          #    --self-contained, no PublishSingleFile. The size ceiling below is
          #    what stops a self-contained regression sneaking back in.
          dotnet publish $proj -c Release -o $pub
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }
          $exe = Join-Path $pub 'PasswordProtect.exe'
          if (-not (Test-Path $exe)) { throw "PasswordProtect.exe was not produced" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("launcher exe: {0:N1} MB" -f $mb)
          if ($mb -gt 40) { throw ("launcher exe is {0:N1} MB - expected ~12 MB; a self-contained/trim regression?" -f $mb) }

          $env:CURO_SUPPRESS_UI = '1'   # no modal dialog may ever block this job

          # 2. Payload fidelity: what the exe carries must be byte-identical to
          #    the audited tree. This is the check that stops the exe silently
          #    shipping a stale or corrupted copy of the tool.
          $out = & $exe --extract-only 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--extract-only failed: $out" }
          $root = ($out -split "`r?`n" | Where-Object { $_.Trim() })[0].Trim()
          if (-not (Test-Path $root)) { throw "--extract-only did not report a real path: '$out'" }
          Write-Host "payload extracted to: $root"

          $checked = 0
          foreach ($rel in @('PasswordProtect.ps1','setup.ps1','install.ps1','uninstall.ps1','VERSION')) {
            $a = Join-Path $src $rel; $b = Join-Path $root $rel
            if (-not (Test-Path $b)) { throw "payload missing $rel" }
            if ((Get-FileHash $a -Algorithm SHA256).Hash -ne (Get-FileHash $b -Algorithm SHA256).Hash) { throw "payload $rel differs from the repo" }
            $checked++
          }
          foreach ($sub in 'src','bin','config','admin') {
            foreach ($f in Get-ChildItem (Join-Path $src $sub) -File) {
              $b = Join-Path $root (Join-Path $sub $f.Name)
              if (-not (Test-Path $b)) { throw "payload missing $sub\$($f.Name)" }
              if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $b -Algorithm SHA256).Hash) { throw "payload $sub\$($f.Name) differs from the repo" }
              $checked++
            }
          }
          Write-Host "payload fidelity OK ($checked files byte-identical to the repo)"

          # 3. Idempotence: a second run must reuse the same cache, not re-extract.
          $again = & $exe --extract-only 2>&1 | Out-String
          if ($again -notmatch 'cached') { throw "second --extract-only did not reuse the cache: $again" }
          if ((($again -split "`r?`n" | Where-Object { $_.Trim() })[0].Trim()) -ne $root) { throw "cache path changed between runs" }
          & $exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--verify failed on an intact cache" }
          Write-Host "cache reuse + full hash verify OK"

          # 4. --diagnose must work even where scripts are blocked (it uses
          #    -EncodedCommand, not -File), and must report the policy scopes.
          $diag = & $exe --diagnose 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0)          { throw "--diagnose failed: $diag" }
          if ($diag -notmatch 'LanguageMode')     { throw "--diagnose did not report LanguageMode" }
          if ($diag -notmatch 'MachinePolicy')    { throw "--diagnose did not report ExecutionPolicy scopes" }
          Write-Host "--diagnose OK"

          # 5. E2E through the exe: setup -> healthy -> protect -> decrypt with
          #    the DOB -> escrow sidecar + audit row. Proves the exe drives the
          #    COMPLIANT path, not merely that it launches.
          $pd        = Join-Path $env:RUNNER_TEMP 'exe-pd'
          $clientOut = Join-Path $env:RUNNER_TEMP 'exe-shared\clients.csv'
          $escrowDir = Join-Path $env:RUNNER_TEMP 'exe-escrow'
          $pfx       = Join-Path $env:RUNNER_TEMP 'exe-escrow.pfx'
          $fixture   = Join-Path $src 'tests\fixtures\clients-sample.csv'
          $la        = Join-Path $env:RUNNER_TEMP 'exe-localappdata'
          New-Item -ItemType Directory -Force -Path $la | Out-Null
          $env:LOCALAPPDATA = $la
          $settings  = Join-Path $la 'CuroPDFProtect\settings.json'
          $env:ProgramData = $pd

          # A [securestring] parameter cannot be bound from a command-line string,
          # so -PfxPassword can never be passed through an exe - by design: a
          # password in argv is visible in the process list (DECISIONS #20), and
          # setup.ps1 prompts for it interactively instead. Escrow keygen also
          # cannot be done up front (Rotate-EscrowKey.ps1 loads the config that
          # setup itself creates). So: bootstrap once by calling the PAYLOAD's
          # setup.ps1 with a real SecureString...
          $psExe = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $boot = "`$env:ProgramData='$pd'; `$env:LOCALAPPDATA='$la'; & '$root\setup.ps1' -Mode Launcher -NonInteractive " +
                  "-ClientListPath '$clientOut' -EscrowDir '$escrowDir' -ClientSource '$fixture' " +
                  "-PfxPath '$pfx' -PfxPassword (ConvertTo-SecureString 'exe-pfx-pw-1' -AsPlainText -Force); exit `$LASTEXITCODE"
          $ErrorActionPreference = 'Continue'
          $bootOut = & $psExe -NoProfile -ExecutionPolicy Bypass -Command $boot 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "payload setup bootstrap failed: $bootOut" }
          if (-not (Test-Path (Join-Path $pd 'CuroPDFProtect\escrow.cer'))) { throw "bootstrap produced no escrow.cer" }

          # ...then re-run setup THROUGH THE EXE. The cert now exists, so this
          # takes setup's documented "already present" skip path - which is
          # exactly what proves the exe forwards its arguments and that a repeat
          # setup is idempotent rather than destructive.
          $setupOut = & $exe --setup -Mode Launcher -NonInteractive `
              -ClientListPath $clientOut -EscrowDir $escrowDir -ClientSource $fixture 2>&1 | Out-String
          $rc = $LASTEXITCODE
          if ($setupOut -notmatch 'Escrow certificate already present') { throw "exe --setup did not reach the idempotent skip path:`n$setupOut" }
          Write-Host "----- exe --setup output -----"; Write-Host $setupOut; Write-Host "----- exit=$rc -----"
          $ErrorActionPreference = 'Stop'
          if ($rc -ne 0) { throw "exe --setup exited $rc" }
          if (-not (Test-Path $settings)) { throw "exe --setup produced no settings.json in the payload cache" }

          Import-Module (Join-Path $root 'src\Config.psm1')  -Force -DisableNameChecking
          Import-Module (Join-Path $root 'src\Protect.psm1') -Force -DisableNameChecking
          $cfg = Get-CuroConfig -Path $settings
          $health = Test-CuroHealth -Path $settings
          if (-not $health.Healthy) { throw "post-setup health not green: $(($health.Issues | ForEach-Object { $_.Component }) -join ', ')" }

          $ErrorActionPreference = 'Continue'   # qpdf writes warnings to stderr
          $work = Join-Path $env:RUNNER_TEMP 'exe-protect'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $qpdf = $cfg.qpdf_path
          $raw = Join-Path $work 'raw.pdf'
          @('%PDF-1.4','1 0 obj','<< /Type /Catalog /Pages 2 0 R >>','endobj','2 0 obj','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','endobj','3 0 obj','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>','endobj','trailer','<< /Root 1 0 R >>','%%EOF') | Set-Content -LiteralPath $raw -Encoding ascii
          $doc = Join-Path $work 'doc.pdf'
          & $qpdf $raw $doc 2>&1 | Out-Null

          $ss = New-Object System.Security.SecureString
          # An arbitrary 8-digit test password, NOT read from the client fixture
          # (this step protects and decrypts with the same literal, so it proves
          # the crypto round-trip, not the clients.csv -> DOB link). The
          # CSV -> client -> password chain is proven in the simulated user
          # journey step, which reads every DOB back from the published list.
          foreach ($c in '01031990'.ToCharArray()) { $ss.AppendChar($c) }
          $ss.MakeReadOnly()
          $prompt = [pscustomobject]@{ SecurePassword=$ss; PasswordSource='dob'; ClientFileRef='C-00502'; DeleteOriginal=$false; AllowOverwrite=$false; OpenOutlook=$false; Cancelled=$false }
          $res = Invoke-ProtectFileCore -Config $cfg -Path $doc -PromptResult $prompt
          if (-not $res.Success) { throw "protect via the exe-produced config failed: $($res.Message)" }
          $outPdf = Join-Path $work 'doc_protected.pdf'
          if (-not (Test-Path $outPdf)) { throw "protected PDF not produced" }
          & $qpdf --password=01031990 --decrypt $outPdf (Join-Path $work 'dec.pdf') 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { throw "decrypt with the DOB failed ($LASTEXITCODE)" }
          $sidecar = Get-ChildItem -Path $escrowDir -Filter '*.escrow.json' -Recurse | Select-Object -First 1
          if (-not $sidecar) { throw "no escrow sidecar written" }
          $auditLog = Join-Path $pd 'CuroPDFProtect\audit.log'
          if (-not (Test-Path $auditLog)) { throw "no audit log written" }
          if ((Get-Content $auditLog -Raw) -notmatch '"outcome":"ok"') { throw "audit log has no ok row" }
          Write-Host "exe E2E OK: setup -> healthy -> protect -> decrypt -> sidecar + audit."

          # 6. Fail-closed must still hold when driven through the exe.
          $deadCfgPath = Join-Path $env:RUNNER_TEMP 'exe-dead-settings.json'
          $j = Get-Content $settings -Raw | ConvertFrom-Json
          $j.escrow_dir = '\\does-not-exist-curo\nope'
          $j | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $deadCfgPath -Encoding UTF8
          $deadCfg = Get-CuroConfig -Path $deadCfgPath
          $doc2 = Join-Path $work 'doc2.pdf'
          Copy-Item $doc $doc2 -Force
          $ss2 = New-Object System.Security.SecureString
          foreach ($c in '01031990'.ToCharArray()) { $ss2.AppendChar($c) }
          $ss2.MakeReadOnly()
          $prompt2 = [pscustomobject]@{ SecurePassword=$ss2; PasswordSource='dob'; ClientFileRef='C-00502'; DeleteOriginal=$false; AllowOverwrite=$false; OpenOutlook=$false; Cancelled=$false }
          $res2 = Invoke-ProtectFileCore -Config $deadCfg -Path $doc2 -PromptResult $prompt2
          if ($res2.Success)                          { throw "dead escrow did not fail closed through the exe payload" }
          if ($res2.ErrorCode -ne 'ESCROW_OFFLINE')   { throw "expected ESCROW_OFFLINE, got $($res2.ErrorCode)" }
          if (Test-Path (Join-Path $work 'doc2_protected.pdf')) { throw "fail-closed left a protected file behind" }
          Write-Host "fail-closed through the exe payload OK (ESCROW_OFFLINE, no output left)."

          # 7. An exe UPDATE must not orphan the config. The payload cache is
          #    keyed by a hash of the exe's contents, so a new build lands in a
          #    new folder; config kept there would vanish and every user would be
          #    told "not set up". Rebuild with a changed payload and assert the
          #    config still resolves, health stays green, and the stale cache is
          #    pruned rather than accumulating ~7.5 MB per user per version.
          $liveCfg = & $exe --diagnose 2>&1 | Out-String
          if ($liveCfg -notmatch '\[LIVE\]') { throw "--diagnose did not report which settings.json is live:`n$liveCfg" }
          if ($liveCfg -notmatch 'per-user \(LOCALAPPDATA\)') { throw "--diagnose did not probe the per-user config path" }

          $cacheParent = Split-Path -Parent $root
          $before = @(Get-ChildItem -Path $cacheParent -Directory).Count

          # Must live in a folder the csproj actually embeds (config\*.*), or the
          # payload hash would not change and this test would prove nothing.
          $bump = Join-Path $src 'config\payload-stamp.txt'
          "ci-payload-bump" | Set-Content -LiteralPath $bump -Encoding ascii
          try {
            $pub2 = Join-Path $env:RUNNER_TEMP 'launcher-publish-v2'
            dotnet publish $proj -c Release -o $pub2 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "v2 publish failed" }
            $exe2 = Join-Path $pub2 'PasswordProtect.exe'
            $out2 = & $exe2 --extract-only 2>&1 | Out-String
            $root2 = ($out2 -split "`r?`n" | Where-Object { $_.Trim() })[0].Trim()
            if ($root2 -eq $root) { throw "payload id did not change after a payload edit - the update test proves nothing" }

            # The whole point: the NEW exe must still find the config the OLD one wrote.
            $h2 = & $exe2 --diagnose 2>&1 | Out-String
            if ($h2 -notmatch '\[LIVE\]') { throw "after update, no live settings.json:`n$h2" }
            Import-Module (Join-Path $root2 'src\Config.psm1') -Force -DisableNameChecking
            $cfg2 = Get-CuroConfig
            if (-not $cfg2) { throw "config did not resolve through the updated exe" }
            $health2 = Test-CuroHealth
            if (-not $health2.Healthy) { throw "health broke after an exe update: $(($health2.Issues | ForEach-Object { $_.Component }) -join ', ')" }

            $after = @(Get-ChildItem -Path $cacheParent -Directory).Count
            if ($after -gt $before) { throw "stale payload caches accumulated ($before -> $after); pruning did not run" }
            Write-Host "exe update OK: new payload id, config survived, health green, old cache pruned."
          } finally {
            Remove-Item -LiteralPath $bump -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Windows 11 modern context menu (build + sign the sparse package)
        run: |
          # Windows 11 shows an extension in the DEFAULT context menu only if it
          # implements IExplorerCommand AND the app has package identity. This
          # builds both halves: the native COM server and the sparse MSIX.
          #
          # What CI can prove: it compiles, the CLSID agrees across source and
          # manifest, the package packs, and it SIGNS and validates. What CI
          # cannot prove is that the verb appears in Explorer - the runner has
          # no interactive shell. That is step 4 of docs\WIN11-ACCEPTANCE.md.
          $ErrorActionPreference = 'Stop'
          $src = (Get-Location).Path
          $out = Join-Path $env:RUNNER_TEMP 'shellext-out'

          # Reuse the launcher exe built earlier in this job.
          $launcher = Join-Path $env:RUNNER_TEMP 'launcher-publish\PasswordProtect.exe'
          if (-not (Test-Path $launcher)) { throw "launcher exe missing - the earlier build step should have produced it" }

          & (Join-Path $src 'shellext\Build-ShellExt.ps1') -OutputDir $out -LauncherExe $launcher

          $dll  = Join-Path $out 'CuroShellExt.dll'
          $msix = Join-Path $out 'CuroPDFProtect.msix'
          foreach ($f in @($dll, $msix, (Join-Path $out 'PasswordProtect.exe'))) {
            if (-not (Test-Path $f)) { throw "build did not produce $f" }
          }
          Write-Host ("CuroShellExt.dll {0:N0} bytes; package {1:N0} bytes" -f (Get-Item $dll).Length, (Get-Item $msix).Length)

          # It must be a real x64 PE exporting the COM entry points, or Explorer
          # would load it and find nothing.
          $bytes = [IO.File]::ReadAllBytes($dll)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          if ($machine -ne 0x8664) { throw ("CuroShellExt.dll is not x64 (machine 0x{0:X})" -f $machine) }
          $dumpbin = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if ($dumpbin) {
            $exports = & $dumpbin.FullName /exports $dll | Out-String
            foreach ($fn in 'DllGetClassObject','DllCanUnloadNow') {
              if ($exports -notmatch $fn) { throw "CuroShellExt.dll does not export $fn" }
            }
            Write-Host "Exports present: DllGetClassObject, DllCanUnloadNow"
          } else {
            Write-Host "NOTE: dumpbin not found - export check skipped (PE arch still verified)."
          }

          # Signed, and the signature must actually validate: an unsigned or
          # mis-signed sparse package cannot be installed at all.
          $sig = Get-AuthenticodeSignature -LiteralPath $msix
          if (-not $sig.SignerCertificate) { throw "package is not signed" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject) (status $($sig.Status))"
          # Self-signed in CI, so the runner does not trust it - UnknownError is
          # expected here. What must NOT happen is a tampered/invalid signature.
          if ($sig.Status -notin @('Valid','UntrustedRoot','UnknownError')) {
            throw "unexpected signature status: $($sig.Status)"
          }

          # The certificate subject MUST equal Identity/@Publisher or the
          # install fails with an opaque mismatch on the user's machine.
          $man = Get-Content (Join-Path $src 'shellext\package\AppxManifest.xml') -Raw
          if ($man -notmatch 'Publisher="([^"]+)"') { throw 'no Publisher in manifest' }
          $publisher = $Matches[1]
          if ($sig.SignerCertificate.Subject -ne $publisher) {
            throw "signer subject '$($sig.SignerCertificate.Subject)' != manifest Publisher '$publisher'"
          }
          Write-Host "Signer subject matches manifest Publisher."

          # Install-ShellExt must refuse Windows 10 and refuse a temp external
          # location - both produce broken installs that are hard to diagnose.
          $guard = & (Join-Path $src 'shellext\Install-ShellExt.ps1') -PackageDir $env:TEMP *>&1 | Out-String
          if ($guard -notmatch 'temp folder|Windows 11') { throw "Install-ShellExt did not guard a temp external location:`n$guard" }
          Write-Host "Install-ShellExt refuses a temp external location."
          Write-Host "Modern context menu builds, packs, signs and validates."
          exit 0

      - name: Simulated user journey (what staff and their admin actually do)
        run: |
          $ErrorActionPreference = 'Stop'
          $psExe = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script = Join-Path (Get-Location).Path 'tests\Simulate-UserJourney.ps1'

          # -STA because the journey calls the real Invoke-Main, which refuses to
          # run outside STA (the WPF dialogs require it). A child process also
          # keeps the script's own `exit` from ending this step early.
          $ErrorActionPreference = 'Continue'
          & $psExe -NoProfile -ExecutionPolicy Bypass -STA -File $script *>&1 | ForEach-Object { Write-Host $_ }
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -ne 0) { throw "the simulated user journey failed (exit $rc) - see the transcript above" }

      - name: Publish the portable exe SHA-256 (the hash to record on the share)
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'launcher-publish\PasswordProtect.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no built exe at $exe" }
          $h = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host ''
          Write-Host '=== PasswordProtect.exe (the file you hand to staff) ==='
          Write-Host ("  size    : {0:N0} bytes ({1:N1} MB)" -f $size, ($size / 1MB))
          Write-Host "  sha256  : $h"
          Write-Host ''
          Write-Host '  Record this alongside the copy you publish. Staff can confirm what'
          Write-Host '  they are running with:  Get-FileHash .\PasswordProtect.exe -Algorithm SHA256'
          Write-Host ''
          # Ship it beside the artifact so the hash travels with the download.
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'launcher-publish\PasswordProtect.exe.sha256') `
                      -Value "$h *PasswordProtect.exe" -Encoding ascii

      # Deployable artifacts upload on pushes to main as well as manual runs:
      # workflow_dispatch needs actions:write, which not every operator (or
      # integration token) holds, and the artifacts ARE the deliverable an
      # admin downloads per docs\ADMIN-SETUP.md. Feature branches still skip
      # the upload to keep routine pushes lean.
      - name: Upload Windows 11 context-menu package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: CuroPDFProtect-shellext
          path: |
            ${{ runner.temp }}/shellext-out/CuroShellExt.dll
            ${{ runner.temp }}/shellext-out/CuroPDFProtect.msix
            ${{ runner.temp }}/shellext-out/CuroPDFProtect-selfsigned.cer
          if-no-files-found: error

      - name: Upload test results / crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-artifacts
          path: |
            pester-results.xml
            PasswordProtect-error.log
          if-no-files-found: ignore

      - name: Upload portable launcher exe
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: PasswordProtect-portable-exe
          path: |
            ${{ runner.temp }}/launcher-publish/PasswordProtect.exe
            ${{ runner.temp }}/launcher-publish/PasswordProtect.exe.sha256
          if-no-files-found: error
